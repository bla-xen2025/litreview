# Litreview Configuration

zotero:
  library_id: "YOUR_ZOTERO_LIBRARY_ID"
  library_type: "user" # 'user' or 'group'
  api_key: "YOUR_API_KEY"
  collection_name: "YOUR_COLLECTION_NAME" # Optional: specify a collection name to fetch from

paths:
  raw_data: "data/raw"
  processed_data: "data/processed"
  plots: "results/plots"

bertopic:
  compute: true
  embedding_model: "all-MiniLM-L6-v2"
  min_topic_size: 10
  seed_topics: []

zeroshot:
  models:
    - "facebook/bart-large-mnli"
    - "MoritzLaurer/deberta-v3-large-zeroshot-v2.0"
  batch_size: 32
  threshold: 0.5
  candidate_labels:
    BLT: "bedload transport"
    MB: "mobile bed"
    HPC: "high performance computing enabled"
    GPU: "gpu accelerated"
    MPI: "distributed memory"
    CPU: "cpu multithreading"
    "2D": "two dimensional"
    "1D": "one dimensional"
    DET: "deterministic"
    STC: "stochastic"
    FVM: "finite volume method"
    FEM: "finite element method"
    FDM: "finite difference method"
    NMD: "numerical method development"
    RBM: "riverbed morphology"
    GHM: "hydrological modeling"
    OM: "ocean modeling"
    CPR: "computational performance report"
    VNM: "validation of numerical method"
    IBER: "iber"
    TELEMAC: "telemac"
    HEC-RAS: "hec-ras"
